name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . --output-format=github --show-fixes
      - name: Format check
        run: ruff format --check .
      - name: Unit tests
        run: pytest -q
      - name: Deterministic evaluation
        run: python -m support_assistant.evaluate --output reports/ci_metrics.json
