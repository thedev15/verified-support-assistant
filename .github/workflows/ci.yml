name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check . --output-format=github --show-fixes
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Deterministic evaluation
        run: python -m support_assistant.evaluate