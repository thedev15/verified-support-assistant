<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verified Support Assistant</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #172033; background: #f4f7fb; }
    body { margin: 0; }
    main { max-width: 820px; margin: 4rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: 18px; padding: 2rem; box-shadow: 0 16px 40px #24324a18; }
    h1 { margin-top: 0; }
    textarea { box-sizing: border-box; width: 100%; min-height: 100px; padding: 1rem; border: 1px solid #cad3e0; border-radius: 10px; font: inherit; }
    button { margin-top: 0.8rem; padding: 0.75rem 1.2rem; border: 0; border-radius: 10px; background: #635bff; color: white; font-weight: 700; cursor: pointer; }
    #answer { white-space: pre-wrap; line-height: 1.55; }
    .citation { margin-top: 0.5rem; padding: 0.6rem; background: #eef2ff; border-radius: 8px; font-size: 0.9rem; }
    .meta { color: #687386; font-size: 0.9rem; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <p class="meta">Citation-first RAG portfolio project</p>
    <h1>Verified Support Assistant</h1>
    <p>Ask about shipping, returns, refunds, warranties, or account security.</p>
    <textarea id="question" aria-label="Question">How long does a refund take?</textarea>
    <br /><button id="ask">Ask</button>
    <h2>Answer</h2><div id="answer" class="meta">No question submitted yet.</div>
    <div id="citations"></div>
  </div>
</main>
<script>
  document.getElementById('ask').onclick = async () => {
    const answer = document.getElementById('answer');
    const citations = document.getElementById('citations');
    answer.textContent = 'Checking verified policies…'; citations.innerHTML = '';
    const response = await fetch('/api/ask', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question: document.getElementById('question').value})});
    const data = await response.json(); answer.textContent = data.answer;
    citations.innerHTML = data.citations.map(c => `<div class="citation"><strong>${c.document_id}: ${c.title}</strong><br>${c.source} · relevance ${c.score}</div>`).join('');
  };
</script>
</body>
</html>
